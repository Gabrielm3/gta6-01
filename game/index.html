<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1230">
  <title>SALTWAKE — an island-port crime game</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #120c22;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      image-rendering: auto;
    }
    #stage {
      position: relative;
      background: #6cc4ff;
    }
    #game {
      position: relative;
      z-index: 1;
    }
    #world3d {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720" aria-label="SALTWAKE game view"></canvas>
    <canvas id="world3d" width="1280" height="720" aria-hidden="true"></canvas>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
